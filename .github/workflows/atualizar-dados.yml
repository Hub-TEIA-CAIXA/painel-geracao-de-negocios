name: Atualizar dados do painel

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Buscar dados no Apps Script
        run: |
          curl -sSL --retry 3 --max-time 120 "https://script.google.com/macros/s/AKfycbyY0HeNHld2QyxB4ykLGjqO1AQOgd3wTKQCwz_Nm-2uDn1Hk-ffdCj_FrHD_OQ0G0veNQ/exec?format=json" -o novo.json
          python3 - <<'PY'
          import json, datetime, sys
          with open("novo.json", encoding="utf-8") as f:
              d = json.load(f)
          if "error" in d or "metrics" not in d:
              print("Resposta sem dados validos:", str(d)[:300])
              sys.exit(1)
          br = datetime.timezone(datetime.timedelta(hours=-3))
          d["atualizadoEm"] = datetime.datetime.now(br).isoformat(timespec="minutes")
          with open("dados.json", "w", encoding="utf-8") as f:
              json.dump(d, f, ensure_ascii=False)
          print("Total de oportunidades:", d["metrics"].get("total"))
          PY
          rm -f novo.json

      - name: Salvar no repositorio
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add dados.json
          if git diff --cached --quiet; then
            echo Sem mudancas nos dados
          else
            git commit -m atualiza-dados-do-painel
            git push
          fi
